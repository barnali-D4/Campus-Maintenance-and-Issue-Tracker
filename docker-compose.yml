
services:
  db:
    image: postgres:17
    container_name: campus_tracker_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: campus_tracker
      POSTGRES_USER: campus_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus_user -d campus_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
